<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 성공 - Homepick</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-box" style="text-align: center;">
    <h2>🎉 로그인 성공!</h2>
    <p><strong th:text="${#authentication.name}">사용자</strong>님 환영합니다.</p>

    <form th:action="@{/logout}" method="post" style="margin-top: 20px;">
        <button type="submit" class="btn-login" style="background-color: #e53935;">로그아웃</button>
    </form>
</div>

</body>
</html>
