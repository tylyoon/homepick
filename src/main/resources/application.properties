spring.application.name=homepick

# : 앞에 있는 DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD는 .env 파일에 정의된 환경 변수입니다.
# 이 환경 변수들은 Spring Boot 애플리케이션이 실행될 때 해당 값으로 대체됩니다. 없을 경우에는 : 뒤에 있는 기본값이 사용됩니다.

# TiDB / MySQL 연결 설정
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:LOCAL_DB_DATABASE}?useSSL=true&characterEncoding=UTF-8
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver